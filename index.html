<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Youtube</title>
    <style>
        body{
            font-family: sans-serif;
            margin: 0;
            background-color: bisque;
        }
        h1 {
            text-align: center;
            color: red;
            margin-top: 4vh;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3vw;
            padding: 5vh;
        }

        .box{
            width: 22vw;
            height: 22vh;
            border-radius: 1vw;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: bottom;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:transform 0.3s ease;
        }
        .box:hover{
            transform: scale(1.1);
        }

        .box a{
            text-decoration: none;
            background-color: white;
            padding: 1vh 2vw;
            border-radius: 2vw;
            font-weight: bold;
            color: black;

            transition: background-color 0.5s ease;
        }
        .box a:hover{
            background-color: red;
        }
        .music{
            background-image: url("https://images.pexels.com/photos/860707/pexels-photo-860707.jpeg");
        }
        .gaming{
            background-image: url("https://images.pexels.com/photos/1298601/pexels-photo-1298601.jpeg");
        }
        .coding{
            background-image: url("https://images.pexels.com/photos/546819/pexels-photo-546819.jpeg");
        }
        .science{
            background-image: url("https://images.pexels.com/photos/714699/pexels-photo-714699.jpeg");
        }
    </style>
</head>

<body>
    <h1>Distraction Free Youtube</h1>

    <div class="container">
        <div class="box music">
            <a href="music.html">Music</a>
        </div>

        <div class="box gaming">
            <a href="gaming.html">Gaming</a>
        </div>

        <div class="box coding">
            <a href="coding.html">Coding</a>
        </div>

        <div class="box science">
            <a href="science.html">Science</a>
        </div>
    </div>

</body>

</html>
