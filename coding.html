<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | DF Youtube</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: bisque;
        }

        button {
            margin: 20px;
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
            font-weight: bold;
            border-radius: 2vw;
            transition: 0.5s ease;
        }

        button:hover {
            background-color: red;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .box {
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.05);
        }

        iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
    </style>
</head>

<body>
    <a href="index.html"><button>&larr; Go back</button></a>
    <br><br>

    <div class="container">

        <div class="box">
            <iframe src="https://www.youtube.com/embed/IeH4GuLi8qw?si=kfd0vg9QDq2Ya4vL" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/U-L7ZkROK2Q?si=D2sze4iVChf6zs_V" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/eKqY-oP1d_Y?si=_yyXgRScZ4fsujCU" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/e7sAf4SbS_g?si=lbcjL3PRnud7U6WH" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/6evmwVDLHzg?si=AaY4V9daCVLBTw4W" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/VlPiVmYuoqw?si=usXDvYjaKsdYA27o" allowfullscreen></iframe>
        </div>

    </div>
</body>

</html>
