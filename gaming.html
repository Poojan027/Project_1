<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | DF Youtube</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: bisque;
        }

        button {
            margin: 20px;
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
            font-weight: bold;
            border-radius: 2vw;
            transition: 0.5s ease;
        }

        button:hover {
            background-color: red;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .box {
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.05);
        }

        iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
    </style>
</head>

<body>
    <a href="index.html"><button>&larr; Go back</button></a>
    <br><br>

    <div class="container">

        <div class="box">
            <iframe src="https://www.youtube.com/embed/ZIwzRBcwnUk?si=kg8rzkJ4BJQAF6x4" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/Xxsf2T7bD5k?si=acxJsMi0jPDhgeqh" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/2NLg-ayFR6I?si=fsmfJ_H_eZTklTUi" allowfullscreen></iframe>
        </div>

        <div class="box">
            <iframe src="https://www.youtube.com/embed/mIvG_aC7i58?si=si_DKQWuePymlMyK" allowfullscreen></iframe>
        </div>

    </div>
</body>

</html>
